<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강의</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="page-lesson.css?v=20261030a">
</head>
<body data-mode="blank">

  <header class="pl-bar">
    <div class="pl-title"><span class="pl-no" id="pl-no"></span><span id="pl-name"></span></div>
    <nav class="pl-modes" id="pl-modes">
      <button class="pick on" type="button" data-act="mode" data-mode="blank">수업</button>
      <button class="pick" type="button" data-act="mode" data-mode="fill">채우기</button>
      <button class="pick" type="button" data-act="mode" data-mode="answer">정답</button>
    </nav>
    <div class="pl-bar-right">
      <span class="pl-count" id="pl-count"></span>
      <button class="btn btn-primary" type="button" data-act="grade" id="pl-grade">채점</button>
      <button class="ib" type="button" data-act="reset" id="pl-reset" title="다시 하기" aria-label="다시 하기"></button>
    </div>
  </header>

  <main class="pl-stage" id="pl-stage">
    <button class="ib pl-nav pl-nav-prev" type="button" data-act="prev" title="이전 쪽" aria-label="이전 쪽"></button>
    <div class="pl-page" id="pl-page">
      <img id="pl-img" alt="">
      <div id="pl-blanks"></div>
    </div>
    <button class="ib pl-nav pl-nav-next" type="button" data-act="next" title="다음 쪽" aria-label="다음 쪽"></button>
  </main>

  <footer class="pl-tray" id="pl-tray"></footer>

<script type="module" src="page-lesson.js?v=20261028f"></script>
</body>
</html>
