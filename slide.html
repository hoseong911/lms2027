<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>강의 슬라이드</title>
<!-- 강의 슬라이드: 늘 새 탭에서 전체화면으로 연다(선생님 지시 2026-10-27, 요구사항 87).
     주 용도가 교사가 교실 화면에 투사하는 것이라, 다른 화면과 달리 여기만 전체화면이다.
     모바일에서는 가로로 눕힌다.

     쪽을 만들고 그리는 것은 slide-deck.js 하나다(축은 shared/slide-axis.js).
     어드민 미리보기가 같은 파일을 불러써서 두 화면이 어긋나지 않는다.
     주소: slide.html?lesson=강의id&no=강번호  (no는 그 강의실에서 몇 번째로 연결했는가) -->
<link rel="stylesheet" href="slide-deck.css?v=20261030v">
<!-- 사료 쪽의 세리프체(선생님 지시 2026-10-30: "사료나 글자료 같은 건 세리프체로") -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--navy);color:#fff;font-family:var(--font)}
#guard{position:fixed;inset:0;display:grid;place-items:center;color:#9FB3CC;font-size:var(--fs-body)}

/* 쪽을 화면 가운데에 꽉 채워 넣는다(잘리지 않게) */
#stage{position:fixed;inset:0;display:grid;place-items:center;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#stage .deckframe{width:min(100vw, calc(100vh * 16 / 9))}

/* 위쪽 막대: 마우스를 올리거나 화면을 건드리면 나온다. 투사 중에는 숨는다 */
#bar{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;
  padding:10px 14px;background:rgba(4,30,66,.92);color:#fff;font-size:var(--fs-meta);
  transform:translateY(-100%);transition:transform .18s;z-index:5}
#bar.show{transform:none}
#bar .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--fs-body)}
#bar .step{color:#9FB3CC}
#bar button{border:1px solid rgba(255,255,255,.35);background:none;color:#fff;border-radius:var(--r-btn);
  padding:0 12px;min-height:var(--h-ctl);font-size:var(--fs-meta);cursor:pointer;font-family:inherit}
#bar button:hover{background:rgba(255,255,255,.12)}
#hot{position:fixed;left:0;right:0;top:0;height:28px;z-index:4}

/* 좌우 넘기기 */
.nav{position:fixed;top:0;bottom:0;width:14vw;max-width:120px;border:0;background:none;cursor:pointer;
  color:#fff;opacity:0;transition:opacity .15s;z-index:3;font-size:30px}
.nav:hover{opacity:.55}
#prev{left:0}#next{right:0}
#dots{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:7px;z-index:3}
#dots i{width:7px;height:7px;background:rgba(255,255,255,.35);display:block}
#dots i.on{background:#fff}
</style>
</head>
<body>
<div id="guard">슬라이드를 불러오는 중…</div>

<div id="stage" hidden>
  <div class="deckframe"><div class="deckpage" id="page"></div></div>
</div>
<button class="nav" id="prev" aria-label="이전 쪽" hidden>‹</button>
<button class="nav" id="next" aria-label="다음 쪽" hidden>›</button>
<div id="dots" hidden></div>
<div id="hot"></div>
<div id="bar">
  <span class="grow" id="bar-title"></span>
  <span class="step" id="bar-step"></span>
  <span id="bar-no"></span>
  <button id="btn-full">전체화면</button>
  <button id="btn-close">닫기</button>
</div>

<script type="module">
import * as M from './model.js?v=20261030v';
import { SLIDE_AXIS } from './shared/slide-axis.js?v=20261030v';
import { buildSlides, renderSlide, stepForward, stepBack, stepsLeft, showAllSteps } from './slide-deck.js?v=20261030v';

const q = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);

await M.loadCore();
const lesson = M.getLesson(q.get('lesson'));
const no = q.get('no') || '';

if (!lesson){
  $('guard').textContent = '강의를 찾지 못했습니다.';
} else {
  const pages = buildSlides(lesson, no);
  const stepName = k => (SLIDE_AXIS.find(a => a.key === k) || {}).name || '';
  let i = 0;

  // 좌우 단추: 첫 쪽이라도 꺼낸 답이 있으면 되돌릴 수 있고, 끝 쪽이라도 남은 답이 있으면 넘길 수 있다
  const syncNav = () => {
    $('prev').hidden = i === 0 && !$('page').querySelector('[data-step].shown');
    $('next').hidden = i === pages.length - 1 && !stepsLeft($('page'));
  };
  const draw = () => {
    $('page').innerHTML = renderSlide(pages[i]);
    $('bar-step').textContent = stepName(pages[i]?.step);
    $('bar-no').textContent = `${i + 1} / ${pages.length}`;
    $('dots').innerHTML = pages.map((_, n) => `<i class="${n === i ? 'on' : ''}"></i>`).join('');
  };
  /* 넘기기(선생님 지시 2026-10-30: 전시학습확인 답은 "화살표 버튼으로 조작하거나 페이지 업다운으로
     조작할때 나오게 해줘. 슬라이드 애니메이션처럼"). 쪽 안에 아직 안 나온 답이 있으면 쪽을 넘기지 않고
     답을 하나 꺼낸다. 되돌리기는 꺼낸 답을 하나씩 도로 넣고, 다 넣은 뒤에 앞 쪽으로 간다.
     앞 쪽으로 돌아갈 때는 그 쪽의 답이 다 나온 모양으로 선다(발표 프로그램과 같다). */
  const go = d => {
    if (d > 0 ? stepForward($('page')) : stepBack($('page'))){ syncNav(); return; }
    const n = i + d;
    if (n >= 0 && n < pages.length){ i = n; draw(); if (d < 0) showAllSteps($('page')); }
    syncNav();
  };

  $('guard').hidden = true;
  $('stage').hidden = false;
  $('dots').hidden = false;
  $('bar-title').textContent = no ? `${no}강. ${lesson.title}` : lesson.title;
  draw(); syncNav();

  /* 전체화면: 브라우저는 사용자가 누른 뒤에만 들어가게 해 준다(자동 진입 불가).
     그래서 이 탭이 열리면 위쪽 막대를 한 번 보여 주고, 버튼을 누르면 들어간다.
     모바일은 전체화면에 들어간 뒤에만 가로 잠금이 먹는다. */
  const goFull = async () => {
    try { await document.documentElement.requestFullscreen(); } catch {}
    try { await screen.orientation?.lock?.('landscape'); } catch {}  // 데스크톱은 조용히 무시된다
  };
  $('btn-full').addEventListener('click', goFull);
  $('btn-close').addEventListener('click', () => window.close());

  // 막대 보이고 숨기기: 위쪽에 마우스를 올리거나 화면을 건드리면
  const bar = $('bar');
  let hide;
  const peek = () => { bar.classList.add('show'); clearTimeout(hide); hide = setTimeout(() => bar.classList.remove('show'), 2600); };
  $('hot').addEventListener('mouseenter', peek);
  bar.addEventListener('mouseenter', () => clearTimeout(hide));
  bar.addEventListener('mouseleave', peek);
  document.addEventListener('touchstart', e => { if (e.touches[0].clientY < 60) peek(); }, { passive:true });
  peek();

  $('prev').addEventListener('click', () => go(-1));
  $('next').addEventListener('click', () => go(1));
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') go(1);
    if (e.key === 'ArrowLeft'  || e.key === 'PageUp') go(-1);
    if (e.key === 'f' || e.key === 'F') goFull();
  });
}
</script>
</body>
</html>
