<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2027 : 관리자 모드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<link rel="stylesheet" href="admin.css?v=20261025b">
<meta name="theme-color" content="#FF6B3D">
</head>
<body>

<!-- ────── 로그인 ──────
     2026 어드민과 같은 방식이다. 선생님만 실제 Firebase Auth 사용자이고
     firestore.rules의 isAdmin()이 이 계정을 본다. -->
<div id="loginScreen">
  <div class="login-wrap">
    <div class="login-brand">2027</div>
    <div class="login-sub">관리자 모드</div>
    <div class="login-fields">
      <input type="email" class="login-input" id="loginEmail" placeholder="이메일" autocomplete="username">
      <input type="password" class="login-input" id="loginPassword" placeholder="비밀번호" autocomplete="current-password">
    </div>
    <div class="login-error" id="loginError"></div>
    <button class="login-enter-btn" id="loginSubmitBtn">접속</button>
  </div>
</div>

<!-- ────── 어드민 ────── -->
<div id="adminView" hidden>
  <header class="adm-header">
    <div class="adm-header-left">
      <div>
        <div class="adm-title"><span class="adm-title-main">DIVE INTO HISTORY</span><span class="adm-title-lms">2027</span></div>
        <div class="adm-sub">관리자 모드</div>
      </div>
    </div>
    <div class="adm-header-right">
      <button type="button" class="ib" id="adminLogoutBtn" title="로그아웃" aria-label="로그아웃">
        <span data-icon="log-out" data-icon-size="18"></span>
      </button>
      <button type="button" class="ib adm-menu-btn" id="admMenuBtn" title="메뉴" aria-label="메뉴">
        <span data-icon="layout-grid" data-icon-size="18"></span>
      </button>
    </div>
  </header>

  <div class="adm-body">
    <div class="adm-sidebar-scrim" id="admSidebarScrim"></div>

    <!-- ── 사이드바 ──
         관리 축이 둘이다. "반별"은 반을 먼저 고르고 그 반의 메뉴들을 보고,
         "메뉴별"은 메뉴를 먼저 고르고 그 메뉴의 반들을 본다. 둘 다 같은
         자리(반 x 메뉴)에 도착한다. -->
    <nav class="adm-sidebar" id="admSidebar">
      <div class="nav-group">
        <div class="nav-item active" data-nav="classes">
          <span class="nav-ic" data-icon="users" data-icon-size="18"></span>
          <span class="nav-label">학급 관리</span>
        </div>
      </div>
      <div class="nav-divider"></div>
      <div class="nav-group">
        <div class="nav-item" data-nav="byclass">
          <span class="nav-ic" data-icon="layout-grid" data-icon-size="18"></span>
          <span class="nav-label">반별 관리</span>
        </div>
        <div class="nav-item" data-nav="bymenu">
          <span class="nav-ic" data-icon="list-ordered" data-icon-size="18"></span>
          <span class="nav-label">메뉴별 관리</span>
        </div>
      </div>
      <div class="nav-divider"></div>
      <div class="nav-group">
        <div class="nav-item" data-nav="library">
          <span class="nav-ic" data-icon="book-open" data-icon-size="18"></span>
          <span class="nav-label">강의 라이브러리</span>
        </div>
      </div>
    </nav>

    <main class="adm-main">

      <!-- ══════ 학급 관리 ══════
           학년도 칩 줄, 태그 줄 셋(과목, 학년, 반), 반 목록 한 줄.
           반을 학년 아래로 묶지 않고 태그로 골라 본다. 태그는 여러 개를 함께 켤 수 있다(2026-10-25).
           버튼은 전부 아이콘이다(CLAUDE.md 화면 규칙). -->
      <section class="panel-page" data-page="classes">
        <div class="page-head">
          <h1 class="page-title">학급 관리</h1>
        </div>

        <div class="year-bar">
          <div class="pick-bar" id="yearBar"></div>
          <div class="year-tools" id="yearTools"></div>
        </div>

        <div class="tag-head">
          <div class="tag-bar" id="tagBar"></div>
          <div class="year-tools" id="classTools"></div>
        </div>

        <div id="classList"><p class="empty">불러오는 중입니다.</p></div>

        <!-- 명단 올리기용 파일 칸. 누른 버튼이 과목 전체인지 반 하나인지 state.upload에 담아 두고 연다. -->
        <input type="file" id="fileRoster" accept=".xlsx,.xls" hidden>
      </section>

      <!-- ══════ 반별 관리 ══════ -->
      <section class="panel-page" data-page="byclass" hidden>
        <div class="page-head">
          <h1 class="page-title">반별 관리</h1>
        </div>
        <div class="pick-bar" id="pickClassBar"></div>
        <div id="byClassBody"></div>
      </section>

      <!-- ══════ 메뉴별 관리 ══════ -->
      <section class="panel-page" data-page="bymenu" hidden>
        <div class="page-head">
          <h1 class="page-title">메뉴별 관리</h1>
        </div>
        <div class="pick-bar" id="pickMenuBar"></div>
        <div id="byMenuBody"></div>
      </section>

      <!-- ══════ 강의 라이브러리 ══════ -->
      <section class="panel-page" data-page="library" hidden>
        <div class="page-head">
          <h1 class="page-title">강의 라이브러리</h1>
        </div>
        <div class="card">
          <div class="card-body">
            <div class="form-row">
              <label class="f f-no">
                <input type="text" id="inpLessonNo" class="inp" placeholder="강 번호"></label>
              <label class="f f-grow">
                <input type="text" id="inpLessonTitle" class="inp" placeholder="강의 제목"></label>
              <button type="button" class="ib ib-primary" id="btnAddLesson" title="강의 추가" aria-label="강의 추가">
                <span data-icon="plus" data-icon-size="18"></span>
              </button>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="card-body">
            <div id="libraryList"><p class="empty">불러오는 중입니다.</p></div>
          </div>
        </div>
      </section>

    </main>
  </div>
</div>

<!-- ────── 공용 모달 ──────
     alert/confirm/prompt 대신 쓴다(admin.js의 ask). 브라우저 기본 대화상자는
     모양을 바꿀 수 없고 자동화 확인 도구도 멈춰 세운다. -->
<div class="modal-scrim" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h2 class="modal-title" id="modalTitle"></h2>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <button type="button" class="ib" id="modalCancel" title="취소" aria-label="취소">
        <span data-icon="x" data-icon-size="18"></span>
      </button>
      <button type="button" class="ib ib-primary" id="modalOk" title="확인" aria-label="확인">
        <span data-icon="check" data-icon-size="18"></span>
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<!-- 엑셀 명단 업로드용. 2026 어드민과 같은 버전을 쓴다. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script type="module" src="admin.js?v=20261025c"></script>
</body>
</html>
