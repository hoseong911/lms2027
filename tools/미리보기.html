<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PC 패드 폰 한눈에</title>
<!-- 세 기기를 동시에 보는 미리보기 (선생님 지시 2026-10-27, 요구사항 89).
     "앞으로 브라우저를 띄울 때 PC, 핸드폰, 패드를 동시에 보여 달라."
     화면을 고칠 때마다 이 주소 하나만 새로고침하면 세 기기가 같이 보인다.
     주소: http://localhost:5500/tools/미리보기.html
     쓰는 법 — 위에서 볼 화면을 고르고, 오른쪽 [다시 불러오기]로 세 틀을 함께 새로 읽는다. -->
<style>
:root{
  --navy:#041E42; --red:#D00F31; --line:#DDE2E9; --sub:#68727F;
  --bg:#EDF0F4; --chrome:#fff;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0E1620;--chrome:#15202E;--line:#243243;--sub:#8E99A8;--navy:#7FA6D8}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--navy);
  font:14px/1.5 "Pretendard","Malgun Gothic",system-ui,sans-serif;overflow-x:hidden}

/* 위쪽 조작 줄 */
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:10px 16px;background:var(--chrome);border-bottom:1px solid var(--line)}
header .ttl{font-weight:800;letter-spacing:.5px}
.pages{display:flex;gap:16px;margin-left:8px}
.pg{font-size:13px;color:var(--sub);background:none;border:0;cursor:pointer;font-family:inherit;
  padding:6px 0;border-bottom:2px solid transparent}
.pg:hover{color:var(--navy)}
.pg.on{color:var(--navy);-webkit-text-stroke:.45px currentColor;border-bottom-color:var(--navy)}
header .sp{flex:1}
header button.act{border:1px solid var(--line);background:none;color:inherit;border-radius:8px;
  padding:7px 13px;font-size:13px;cursor:pointer;font-family:inherit}
header button.act:hover{border-color:var(--navy)}
header .url{font:12px/1 ui-monospace,Consolas,monospace;color:var(--sub)}

/* 기기 세 대 */
#rail{padding:22px 16px 40px;overflow:hidden}
#row{display:flex;gap:26px;align-items:flex-start;transform-origin:top left}
figure{margin:0;flex:none}
figcaption{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;font-size:13px;font-weight:700}
figcaption .px{font-weight:400;color:var(--sub);font:12px ui-monospace,Consolas,monospace}
.screen{background:#fff;border:1px solid var(--line);overflow:hidden}
.screen iframe{display:block;border:0;background:#fff}
/* 폰과 패드는 둥근 모서리로 기기처럼 */
.m .screen{border-radius:18px}
.t .screen{border-radius:12px}
.d .screen{border-radius:4px}
</style>
</head>
<body>

<header>
  <span class="ttl">미리보기</span>
  <div class="pages" id="pages"></div>
  <span class="sp"></span>
  <span class="url" id="url"></span>
  <button class="act" id="reload">다시 불러오기</button>
</header>

<div id="rail"><div id="row"></div></div>

<script>
// 볼 화면들. 레포에 화면이 늘면 여기에 한 줄 더한다.
const PAGES = [
  { key:'student', name:'학생',   src:'../index.html' },
  { key:'admin',   name:'어드민', src:'../admin.html' },
  { key:'slide',   name:'슬라이드', src:'../slide.html?lesson=L1' },
];
// 기기 세 대. 폭은 실제로 많이 쓰는 값.
const DEVICES = [
  { cls:'d', name:'PC',   w:1440, h:900  },
  { cls:'t', name:'패드', w:820,  h:1100 },
  { cls:'m', name:'폰',   w:390,  h:844  },
];

const $ = id => document.getElementById(id);
let page = PAGES[0];

function drawPages(){
  $('pages').innerHTML = PAGES.map(p =>
    `<button class="pg ${p.key === page.key ? 'on' : ''}" data-k="${p.key}">${p.name}</button>`).join('');
  $('url').textContent = page.src.replace('../', '/');
}

function drawRow(){
  $('row').innerHTML = DEVICES.map(d => `
    <figure class="${d.cls}">
      <figcaption>${d.name} <span class="px">${d.w} × ${d.h}</span></figcaption>
      <div class="screen" style="width:${d.w}px;height:${d.h}px">
        <iframe src="${page.src}" width="${d.w}" height="${d.h}" loading="eager"></iframe>
      </div>
    </figure>`).join('');
  // 틀을 새로 그렸으니 연동을 다시 건다
  for (const f of document.querySelectorAll('#row iframe')){
    f.addEventListener('load', () => hook(f));
    if (f.contentDocument?.readyState === 'complete') hook(f);
  }
  fit();
}

/* 세 대를 한 화면에 다 넣는다 — 전체 폭에 맞춰 통째로 줄인다.
   iframe 안쪽은 원래 크기 그대로라서, 줄여도 반응형 분기점은 진짜 기기와 같게 걸린다. */
function fit(){
  const row = $('row'), rail = $('rail');
  row.style.transform = 'none';
  const need = row.scrollWidth;
  const have = rail.clientWidth - 32;
  const k = Math.min(1, have / need);
  row.style.transform = `scale(${k})`;
  rail.style.height = (row.scrollHeight * k + 40) + 'px';
}

/* ── 세 기기 연동 (선생님 지시 2026-10-28) ────────────────────────────────
   하나를 누르거나 입력하면 나머지 둘도 똑같이 따라 한다. 셋을 손으로 따로
   조작하지 않아도 같은 화면을 세 폭에서 나란히 볼 수 있다.
   같은 주소(localhost)에서 띄우므로 iframe 속 document에 그대로 닿는다.

   누른 자리를 좌표로 옮기지 않는다 — 폭이 달라 자리가 어긋나기 때문이다.
   대신 누른 요소의 data-act 같은 표시로 "무엇을 눌렀는지"를 옮긴다. */
let syncing = false;              // 따라 하는 중에 생긴 이벤트를 되돌려 보내지 않기 위한 빗장
const lastRatio = new WeakMap();  // 틀마다 마지막으로 맞춰 둔 스크롤 비율(메아리 가려내기)

const frames = () => [...document.querySelectorAll('#row iframe')];

// 누른 요소를 다른 틀에서도 찾을 수 있는 표시로 바꾼다
function sig(el){
  if (!el || el.nodeType !== 1) return null;
  const act = el.closest('[data-act]');
  if (act){
    const attrs = [...act.attributes].filter(a => a.name.startsWith('data-'))
      .map(a => `[${a.name}="${CSS.escape(a.value)}"]`).join('');
    return { sel: act.tagName.toLowerCase() + attrs };
  }
  if (el.id) return { sel: `#${CSS.escape(el.id)}` };
  const parts = [];
  let n = el;
  while (n && n.nodeType === 1 && n.parentElement){
    const i = [...n.parentElement.children].indexOf(n);
    parts.unshift(`${n.tagName.toLowerCase()}:nth-child(${i + 1})`);
    if (n.parentElement === n.ownerDocument.body) break;
    n = n.parentElement;
  }
  return parts.length ? { sel: `body>${parts.join('>')}` } : null;
}

const findIn = (doc, s) => { try { return doc.querySelector(s.sel); } catch { return null; } };

// 나를 뺀 나머지 틀에 같은 일을 시킨다
function relay(from, fn){
  syncing = true;
  try {
    for (const f of frames()){
      if (f === from) continue;
      const d = f.contentDocument;
      if (d) { try { fn(d); } catch {} }
    }
  } finally { setTimeout(() => { syncing = false; }, 0); }
}

function hook(ifr){
  const doc = ifr.contentDocument;
  if (!doc || doc.__synced) return;
  doc.__synced = true;

  doc.addEventListener('click', e => {
    if (syncing) return;
    const s = sig(e.target); if (!s) return;
    relay(ifr, d => findIn(d, s)?.click());
  }, true);

  // 글자 입력, 체크, 고르기
  for (const type of ['input', 'change']){
    doc.addEventListener(type, e => {
      if (syncing) return;
      const t = e.target; if (!t || !('value' in t)) return;
      const s = sig(t); if (!s) return;
      relay(ifr, d => {
        const el = findIn(d, s); if (!el) return;
        if (el.type === 'checkbox' || el.type === 'radio') el.checked = t.checked;
        else el.value = t.value;
        el.dispatchEvent(new d.defaultView.Event(type, { bubbles: true }));
      });
    }, true);
  }

  // 키 조작(슬라이드의 화살표, 스페이스 등). 글자 입력은 위에서 이미 옮긴다
  doc.addEventListener('keydown', e => {
    if (syncing) return;
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target?.tagName || '')) return;
    relay(ifr, d => d.dispatchEvent(new d.defaultView.KeyboardEvent('keydown', {
      key: e.key, code: e.code, bubbles: true,
      shiftKey: e.shiftKey, ctrlKey: e.ctrlKey, altKey: e.altKey,
    })));
  }, true);

  /* 스크롤은 폭마다 길이가 달라 비율로 맞춘다.
     옮겨 준 쪽에서도 scroll 이벤트가 되울려 오므로, 방금 맞춰 둔 비율과
     같으면 그냥 흘려보낸다. 이 메아리를 안 끊으면 셋이 서로를 끝없이 깨운다. */
  doc.addEventListener('scroll', () => {
    if (syncing) return;
    const me = doc.scrollingElement; if (!me) return;
    const r = me.scrollTop / Math.max(1, me.scrollHeight - me.clientHeight);
    const echo = lastRatio.get(doc);
    if (echo != null && Math.abs(echo - r) < 0.003) return;
    lastRatio.set(doc, r);
    relay(ifr, d => {
      const el = d.scrollingElement; if (!el) return;
      lastRatio.set(d, r);
      el.scrollTop = r * Math.max(0, el.scrollHeight - el.clientHeight);
    });
  }, true);
}

$('pages').addEventListener('click', e => {
  const b = e.target.closest('[data-k]'); if (!b) return;
  page = PAGES.find(p => p.key === b.dataset.k);
  drawPages(); drawRow();
});
$('reload').addEventListener('click', drawRow);
addEventListener('resize', fit);

drawPages(); drawRow();
</script>
</body>
</html>
