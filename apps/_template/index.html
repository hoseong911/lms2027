<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 제목은 앱 이름만. 어드민은 "앱 이름 : 관리자 모드" -->
<title>활동 이름</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="../../shared/app-base.css?v=20261026a">
<style>
  /* 이 앱에만 있는 것을 여기 적는다. **색은 --app-* 변수로만 쓴다.**
     #색상값을 직접 적으면 다른 앱과 톤이 갈린다. */
</style>
</head>
<body class="app">

<header class="app-head">
  <div class="app-head-left">
    <span class="app-title">활동 이름</span>
  </div>
  <div class="app-head-mid"></div>
  <div class="app-head-right">
    <span class="app-title-sub" id="who"></span>
  </div>
</header>

<main class="app-main">
  <!-- 로그인 안내가 들어갈 자리. 학생이 확인되면 숨고 본문이 보인다. -->
  <div id="gate" hidden></div>

  <div id="body" hidden>
    <div class="app-card">
      <div class="app-card-head">
        <h2 class="app-card-title">여기부터 이 앱의 내용</h2>
      </div>
      <div class="app-card-body">
        <textarea class="app-inp" id="answer" placeholder="답을 적는다"></textarea>
      </div>
    </div>
    <div style="display:flex;justify-content:center;margin-top:16px">
      <button type="button" class="app-btn app-btn-primary" id="submitBtn">제출하기</button>
    </div>
  </div>
</main>

<div class="app-toast" id="toast" hidden></div>

<script type="module">
/* ─────────────────────────────────────────────────────────
   미션 앱 뼈대: 이 폴더를 복사해서 새 앱을 만든다.
   고칠 곳은 APP_KEY와 화면 내용뿐이고, 아래 네 가지는 그대로 둔다.
     1) 신원은 lms-session.js로만 얻는다 (직접 sessionStorage를 읽지 말 것)
     2) 제출은 markSubmitted로 알린다 (제출 컬렉션을 새로 파지 말 것)
     3) 앱 고유 데이터는 appCollection(APP_KEY, '기능')으로 이름을 짓는다
     4) 색은 --app-* 변수로만 쓴다
   자세한 건 레포 루트의 APP_규약.md.
   ───────────────────────────────────────────────────────── */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { initializeFirestore, doc, setDoc, getDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from "../../shared/firebase-config.js";
import { requireStudent } from "../../shared/lms-session.js?v=20261026a";
import { markSubmitted, appCollection } from "../../shared/lms-submit.js?v=20261026a";

// 앱 키 = 이 폴더 이름. LMS 미션 카드의 "앱 키"와 **같아야** 성적이 붙는다.
const APP_KEY = '_template';

const app = initializeApp(firebaseConfig);
// 학교 와이파이에서 웹소켓이 막히는 경우가 있어 롱폴링 자동 감지를 켠다(LMS와 같은 설정).
const db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });

const $ = id => document.getElementById(id);
const toast = (text, kind = 'ok') => {
  const t = $('toast');
  t.textContent = text;
  t.classList.toggle('err', kind === 'err');
  t.hidden = false;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.hidden = true; }, 2600);
};

// 학생이 누구인지. 없으면 안내만 그리고 끝낸다.
const me = requireStudent($('gate'));
if (me) {
  $('who').textContent = `${me.name} (${me.studentId})`;
  $('body').hidden = false;
  load();
}

// 이 앱의 작품이 들어갈 컬렉션. 이름 규칙을 함수가 검사한다.
const WORKS = appCollection(APP_KEY, 'works');
const workRef = () => doc(db, WORKS, `${me.year}_${me.studentId}`);

async function load() {
  try {
    const s = await getDoc(workRef());
    if (s.exists()) $('answer').value = s.data().answer || '';
  } catch (e) {
    console.warn('[load]', e);
  }
}

$('submitBtn').addEventListener('click', async () => {
  const answer = $('answer').value.trim();
  if (!answer) { toast('답을 적는다.', 'err'); return; }
  $('submitBtn').disabled = true;
  try {
    // 1) 앱 고유 데이터는 앱 컬렉션에
    await setDoc(workRef(), {
      year: me.year, courseId: me.courseId, studentId: me.studentId, studentName: me.name,
      answer, updatedAt: serverTimestamp(),
    }, { merge: true });
    // 2) "냈다"는 공용 컬렉션에 한 줄. 이것만으로 LMS 성적에 붙는다.
    await markSubmitted(db, APP_KEY, me);
    toast('제출했다.');
  } catch (e) {
    console.warn('[submit]', e);
    toast('제출하지 못했다. ' + e.message, 'err');
  } finally {
    $('submitBtn').disabled = false;
  }
});
</script>
</body>
</html>
